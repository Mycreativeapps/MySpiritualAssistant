name: CI and Docker Push

on:
  push:
    branches:
      - Backend/prod
  workflow_dispatch:

permissions:
  contents: write      

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Get user ID for verified noreply email
        id: get_user
        run: |
          USER="${{ github.actor }}"
          USER_ID=$(curl -s https://api.github.com/users/$USER | jq -r .id)
          echo "FULL_EMAIL=${USER_ID}+${USER}@users.noreply.github.com" >> $GITHUB_ENV
      
      - name: Set Git config
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ env.FULL_EMAIL }}"
      
      - name: Define version
        id: get_version
        run: |
          # Grabbing version from package.json
          VERSION=1.0.4
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
              
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          file: Dockerfile
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/myspiritualassistant:${{ env.VERSION }}
