version: '3.9'

services:
  server:
    image: myspiritualcoach-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myspiritualcoach-server
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api-docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
