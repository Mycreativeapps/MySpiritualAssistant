version: "3.8"

services:

  backend:
    image: mycreativeapps/myspiritualassistant:1.0.24
    container_name: myspiritualassistant-backend
    restart: always

    ports:
      - "5000:5000"

    env_file:
      - .env

    depends_on:
      - postgres-prod

    networks:
      - spiritual-network


  postgres-prod:
    image: postgres:16
    container_name: postgres-prod
    restart: always

    environment:
      POSTGRES_DB: prod
      POSTGRES_USER: prod_user
      POSTGRES_PASSWORD: BWik9iVpwG2K26djMHMcOk3Xq

    ports:
      - "5433:5432"

    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

    networks:
      - spiritual-network


volumes:
  postgres_prod_data:


networks:
  spiritual-network:
    driver: bridge
